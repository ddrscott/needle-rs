[package]
name = "needle-wasm"
description = "Needle 3 in the browser: the agent over wasm-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
needle-core.workspace = true
needle-engine.workspace = true
anyhow.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# wasm-opt comes from the binaryen the build installs; -O3 plus the
# features Rust's wasm target already emits.
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]

[lints]
workspace = true
