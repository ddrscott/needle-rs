[package]
name = "needle-engine"
description = "Needle 3 inference: the reference forward pass, KV-cached decoding, confidence and embedding heads"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
needle-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
half.workspace = true
rayon.workspace = true
fancy-regex.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `Instant` that works in a browser (it is `std`'s everywhere else).
web-time.workspace = true

# Apple's libm is the engine's; elsewhere the musl port stands in (results
# can differ in the last bit, so parity is claimed on macOS only).
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
libm.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
matrixmultiply = { version = "0.3", features = ["threading"] }

[dev-dependencies]

[lints]
workspace = true
